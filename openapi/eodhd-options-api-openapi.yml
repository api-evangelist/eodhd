          - call
        description: Option type
      - name: filter[strike_eq]
        in: query
        schema:
          type: number
        description: Strike equals
      - name: filter[strike_from]
        in: query
        schema:
          type: number
        description: Strike from
      - name: filter[strike_to]
        in: query
        schema:
          type: number
        description: Strike to
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - exp_date
          - strike
          - -exp_date
          - -strike
        description: Sort by expiration date or strike (asc/desc).
      - name: page[offset]
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Pagination offset (records to skip). Max 10000.
      - name: page[limit]
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
