          minimum: 1
          maximum: 100
          default: 20
      - name: fmt
        in: query
        required: false
        description: Output format.
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      responses:
        '200':
          description: Successfully retrieved sanctioned vessels.
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                - links
                properties:
                  meta:
                    type: object
                    description: Pagination and field metadata.
                    required:
                    - total
                    - fields
                    properties:
                      offset:
                        type: integer
                        minimum: 0
                      limit:
                        type: integer
                        minimum: 1
                      total:
                        type: integer
                        minimum: 0
                      fields:
                        type: array
                        items:
                          type: string
                      compact:
                        type:
                        - boolean
                        - 'null'
                    additionalProperties: false
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the record.
                        call_sign:
                          type:
                          - string
                          - 'null'
                          description: Vessel call sign.
                        vessel_type:
                          type:
                          - string
                          - 'null'
                          description: Type of vessel.
                        flag:
                          type:
                          - string
                          - 'null'
                          description: Flag (country of registration).
                        tonnage:
                          type:
                          - number
                          - 'null'
                          description: Vessel tonnage.
                        gross_tonnage:
                          type:
                          - number
                          - 'null'
                          description: Gross registered tonnage.
                        owner:
                          type:
                          - string
                          - 'null'
                          description: Vessel owner.
                        imo_number:
                          type:
                          - string
                          - 'null'
                          description: IMO number.
                        mmsi:
                          type:
                          - string
                          - 'null'
                          description: Maritime Mobile Service Identity.
                        entity_source_uid:
                          type: string
                          description: Source UID of the linked sanctioned entity.
                        entity_name:
                          type: string
                          description: Name of the linked sanctioned entity.
                        source:
                          type: string
                          description: Sanctions data source (e.g., 'OFAC').
                        programs:
                          type: array
                          description: Sanctions program codes the vessel is listed under.
                          items:
                            type: string
                        country:
                          type: string
                          description: Associated country.
                        is_active:
                          type: boolean
                          description: Whether the listing is currently active.
                  links:
                    type: object
                    required:
                    - next
                    properties:
                      next:
                        type:
                        - string
                        - 'null'
                        description: URL to fetch the next page, or null if last page.
                    additionalProperties: false
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
        '422':
          description: 'Validation error. Returned when a parameter is malformed or a filter value is invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
      tags:
      - Sanctions
